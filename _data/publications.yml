# Publications shown on the homepage, newest first.
# Fields:
#   title, url       – paper title and where the title links to
#   authors          – HTML allowed; wrap your own name in <strong>…</strong>
#   venue            – short venue line, e.g. "NeurIPS 2026 · FLLMPT workshop"
#   workshop, conference – optional venue shown as Workshop @ Conference
#   note             – optional text after the venue (e.g. "*equal contribution")
#   image, image_alt – teaser figure, displayed at its natural proportions
#   links            – buttons under the entry (label + url)
#   awards           – badges: kind (Oral / Poster / Best Paper …), optional venue

main:

